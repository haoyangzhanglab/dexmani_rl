name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1+cpu torchvision==0.19.1+cpu
          python -m pip install -e .
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile and check package imports
        run: |
          python -m compileall -q dexmani_rl tests
          python -c "import dexmani_rl.core"
          python -c "import dexmani_rl.policies"
          python -c "import dexmani_rl.envs.adapters"
      - name: Check training entry points
        run: |
          python -m dexmani_rl.train_dsrl --help
          python -m dexmani_rl.train_rfs --help
          python -m dexmani_rl.train_robofft --help
          python -m dexmani_rl.train_bora --help
